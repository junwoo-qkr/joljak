<!DOCTYPE html>
<html lang="ko">
{% load static %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeAI - Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --radius: 0.625rem; }
    @keyframes slideInUp { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }
    @keyframes slideInDown { from { opacity: 0; transform: translateY(-20px);} to { opacity: 1; transform: translateY(0);} }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95);} to { opacity: 1; transform: scale(1);} }
    .initial-hidden { opacity: 0; }
    .animate-slide-in-up { animation: slideInUp .6s ease-out forwards; }
    .animate-slide-in-down { animation: slideInDown .6s ease-out forwards; }
    .animate-scale-in { animation: scaleIn .6s ease-out forwards; }
    .delay-200{animation-delay:.2s}.delay-300{animation-delay:.3s}.delay-500{animation-delay:.5s}
    .hover-shadow:hover { box-shadow: 0 20px 25px -5px rgba(0,0,0,.1), 0 10px 10px -5px rgba(0,0,0,.04); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-pink-50 overflow-auto relative">
  <!-- background blobs -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-gradient-to-br from-purple-200/30 to-pink-200/30 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-gradient-to-tr from-blue-200/30 to-purple-200/30 rounded-full blur-3xl"></div>
  </div>

  <!-- header / nav -->
  <header class="relative z-10 px-6 py-4">
    <nav class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 initial-hidden animate-slide-in-down">
        <a href="{% url 'recommendation:start' %}" class="w-10 h-10 bg-gradient-to-br from-purple-500 via-pink-500 to-red-500 rounded-lg flex items-center justify-center shadow-lg transition">
          <img src="{% static 'images/LOGO.png' %}" alt="VibeAI Heart Logo" class="w-7 h-7">
        </a>
        <span class="text-2xl bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">VibeAI</span>
      </div>
      <div class="hidden md:flex items-center gap-1 bg-white/80 backdrop-blur-sm rounded-full px-2 py-2 shadow-lg border border-white/20 initial-hidden animate-slide-in-down delay-200">
        <a href="{% url 'recommendation:start' %}" class="px-4 py-2 rounded-full text-sm text-gray-600 hover:text-purple-600">Find by Emotion</a>
        <a href="{% url 'recommendation:history' %}" class="px-4 py-2 rounded-full text-sm text-gray-600 hover:text-purple-600">My Playlist</a>
        <a href="{% url 'recommendation:about' %}" class="px-4 py-2 rounded-full text-sm text-gray-600 hover:text-purple-600">About VibeAI</a>
        <a href="{% url 'recommendation:contact' %}" class="px-4 py-2 rounded-full text-sm text-gray-600 hover:text-purple-600">Contact / Feedback</a>
      </div>
    </nav>
  </header>

  <!-- main -->
  <main id="contact" class="relative z-10 px-6 py-10">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-10 initial-hidden animate-scale-in">
        <h1 class="text-3xl md:text-4xl font-medium text-gray-800">제작자 연락처</h1>
        <p class="text-gray-600 mt-2">프로젝트에 대한 피드백이나 문의를 아래 연락처로 보내주세요.</p>
      </div>

      <!-- cards -->
      <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Card 1 -->
        <article class="bg-white/90 backdrop-blur-md rounded-2xl border border-white/30 shadow-lg p-6 initial-hidden animate-slide-in-up">
          <header class="flex items-center gap-4 mb-4">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white font-semibold">P</div>
            <div>
              <h2 class="text-xl font-semibold text-gray-800">박준우</h2>
              <p class="text-sm text-gray-500">정보통신공학과</p>
            </div>
          </header>
          <div class="space-y-3">
            <div class="flex items-center gap-3">
              <!-- phone icon -->
              <svg class="w-5 h-5 text-purple-600" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.1.37 2.28.57 3.5.57a1 1 0 011 1v3.49a1 1 0 01-1 1C11.07 22 2 12.93 2 2.99a1 1 0 011-1H6.5a1 1 0 011 1c0 1.22.2 2.4.57 3.5a1 1 0 01-.25 1.01l-2.2 2.29z"/></svg>
              <span class="text-gray-700">010-4081-9206</span>
            </div>
            <div class="flex items-center gap-3">
              <!-- email icon -->
              <svg class="w-5 h-5 text-purple-600" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
              <span class="text-gray-700">p40212@gmail.com</span>
            </div>
          </div>
        </article>

        <!-- Card 2 -->
        <article class="bg-white/90 backdrop-blur-md rounded-2xl border border-white/30 shadow-lg p-6 initial-hidden animate-slide-in-up delay-200">
          <header class="flex items-center gap-4 mb-4">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white font-semibold">K</div>
            <div>
              <h2 class="text-xl font-semibold text-gray-800">김선민</h2>
              <p class="text-sm text-gray-500">정보통신공학과</p>
            </div>
          </header>
          <div class="space-y-3">
            <div class="flex items-center gap-3">
              <svg class="w-5 h-5 text-purple-600" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.1.37 2.28.57 3.5.57a1 1 0 011 1v3.49a1 1 0 01-1 1C11.07 22 2 12.93 2 2.99a1 1 0 011-1H6.5a1 1 0 011 1c0 1.22.2 2.4.57 3.5a1 1 0 01-.25 1.01l-2.2 2.29z"/></svg>
              <span class="text-gray-700">010-5292-2787</span>
            </div>
            <div class="flex items-center gap-3">
              <svg class="w-5 h-5 text-purple-600" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
              <span class="text-gray-700">ksm000826@naver.com</span>
            </div>
          </div>
        </article>
      </section>

      <!-- back button -->
      <div class="mt-12 text-center initial-hidden animate-slide-in-up delay-600">
        <button onclick="location.href='{% url 'recommendation:start' %}'"
          class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white px-8 py-4 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300">
          홈으로 돌아가기
        </button>
      </div>
    </div>
  </main>

  <script>
    window.addEventListener('load', () => {
      document.querySelectorAll('.initial-hidden').forEach(el => el.classList.remove('initial-hidden'));
    });
  </script>
</body>
</html>
