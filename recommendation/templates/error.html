<!DOCTYPE html>
<html lang="ko">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeAI - 오류가 발생했어요</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --radius: 0.625rem; }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        .initial-hidden { opacity: 0; }
        .animate-slide-in-up { animation: slideInUp .6s ease-out forwards; }
        .animate-slide-in-down { animation: slideInDown .6s ease-out forwards; }
        .animate-fade-in-scale { animation: fadeInScale .5s ease-out forwards; }
        .delay-200{animation-delay:.2s}.delay-400{animation-delay:.4s}.delay-600{animation-delay:.6s}
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-pink-50 overflow-auto relative">
    <!-- 배경 블러 원 -->
    <div class="absolute inset-0 overflow-hidden -z-10">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-gradient-to-br from-purple-200/30 to-pink-200/30 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-gradient-to-tr from-blue-200/30 to-purple-200/30 rounded-full blur-3xl"></div>
    </div>

    <!-- 헤더 (main.html 스타일) -->
    <header class="relative z-10 px-6 py-4">
        <nav class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 initial-hidden animate-slide-in-down">
                <a href="{% url 'recommendation:start' %}"
                   class="w-10 h-10 bg-gradient-to-br from-purple-500 via-pink-500 to-red-500 rounded-lg flex items-center justify-center shadow-lg transition-all duration-300">
                    <img src="{% static 'images/LOGO.png' %}" alt="VibeAI Heart Logo" class="w-7 h-7">
                </a>
                <span class="text-2xl bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">VibeAI</span>
            </div>
            <div class="hidden md:flex items-center gap-1 bg-white/80 backdrop-blur-sm rounded-full px-2 py-2 shadow-lg border border-white/20 initial-hidden animate-slide-in-down delay-200">
                <a href="{% url 'recommendation:start' %}" class="px-4 py-2 rounded-full text-sm text-gray-600 hover:text-purple-600">Find by Emotion</a>
                <a href="{% url 'recommendation:history' %}" class="px-4 py-2 rounded-full text-sm text-gray-600 hover:text-purple-600">My Playlist</a>
                <a href="{% url 'recommendation:about' %}" class="px-4 py-2 rounded-full text-sm text-gray-600 hover:text-purple-600">About VibeAI</a>
                <a href="{% url 'recommendation:contact' %}" class="px-4 py-2 rounded-full text-sm text-gray-600 hover:text-purple-600">Contact / Feedback</a>
            </div>
        </nav>
    </header>
    <main class="relative z-10 px-6 py-10">
        <div class="max-w-3xl mx-auto">
            <section class="bg-white/90 backdrop-blur-md rounded-2xl shadow-lg border border-white/30 p-8 initial-hidden animate-fade-in-scale">
                <div class="text-center">
                    <div class="mx-auto w-16 h-16 rounded-2xl flex items-center justify-center bg-red-100 text-red-600 text-3xl">!</div>
                    <h1 class="mt-4 text-3xl md:text-4xl font-medium text-gray-800">요청을 처리하는 중 오류가 발생했어요</h1>
                    <p class="mt-2 text-gray-600">잠시 후 다시 시도해 주세요. 문제가 계속되면 아래 상세 정보를 확인해 주세요.</p>
                </div>
                <div class="mt-4">
                    <a id="toggleDetails"
                       href="#detailsPanel"
                       role="button"
                       aria-controls="detailsPanel"
                       aria-expanded="false"
                       class="inline-flex items-center gap-2 text-sm font-medium underline underline-offset-4 text-purple-700 hover:text-purple-900 cursor-pointer">
                        자세히보기
                    </a>

                    <div id="detailsPanel" class="mt-3 hidden">
                        <div class="rounded-xl border border-gray-200 bg-gray-50">
                            <div class="px-4 py-2 text-xs text-gray-500 border-b border-gray-200">상세 오류 메시지</div>
                            <pre class="p-4 text-sm text-gray-800 overflow-auto whitespace-pre-wrap leading-6"><code>{{ error_message }}</code></pre>
                        </div>
                    </div>
                </div>
                <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
                    <a href="{% url 'recommendation:start' %}"
                       class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700
                              text-white px-6 py-3 rounded-2xl shadow-lg text-center transition-all">
                        처음 화면으로
                    </a>
                </div>
            </section>
        </div>
    </main>
    <script>
        window.addEventListener('load', () => {
            document.querySelectorAll('.initial-hidden').forEach(el => el.classList.remove('initial-hidden'));
        });
        (function () {
            const link = document.getElementById('toggleDetails');
            const panel = document.getElementById('detailsPanel');
            if (!link || !panel) return;

            let open = false;
            link.addEventListener('click', (e) => {
                e.preventDefault();
                open = !open;
                panel.classList.toggle('hidden', !open);
                link.setAttribute('aria-expanded', String(open));
                link.lastChild.nodeValue = open ? ' 접기' : ' 자세히보기';
            });
        })();
    </script>
</body>
</html>
